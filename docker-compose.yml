
services:
  calculator:
    image: svnsaisathvik/calculator-api:${IMAGE_TAG:-2.0}
    container_name: calculator-container
    expose:
      - "8080"
    networks:
      - calculator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: calculator-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calculator-network
    restart: unless-stopped

networks:
  calculator-network:
    driver: bridge
